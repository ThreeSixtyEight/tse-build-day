<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder for Gabe's Snug Harbor stage scene: Jon at the piano, a stage light raking in from the top right. -->
  <defs>
    <pattern id="brick" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#3a1f18"/>
      <path d="M0 0H80M0 20H80M40 0V20M0 20V40M80 20V40" stroke="#2a1510" stroke-width="3"/>
    </pattern>
    <linearGradient id="beam" x1="1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffe2a3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe2a3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#brick)"/>
  <rect width="1600" height="1000" fill="#120a08" opacity="0.45"/>
  <rect y="780" width="1600" height="220" fill="#1c100c"/>
  <rect y="780" width="1600" height="8" fill="#5a3a22"/>
  <polygon points="1600,0 1600,140 1180,900 900,900" fill="url(#beam)"/>
  <ellipse cx="1060" cy="860" rx="360" ry="70" fill="url(#pool)"/>
  <!-- grand piano -->
  <path d="M820 600 Q820 540 900 540 L1180 540 Q1300 540 1320 610 Q1330 660 1250 660 L840 660 Q820 660 820 640Z" fill="#0b0706"/>
  <path d="M900 540 L1010 430 L1030 440 L930 545Z" fill="#0b0706"/>
  <rect x="845" y="660" width="16" height="140" fill="#0b0706"/>
  <rect x="1230" y="660" width="16" height="140" fill="#0b0706"/>
  <rect x="820" y="600" width="140" height="14" fill="#e9dcc2"/>
  <!-- pianist on the bench -->
  <rect x="700" y="700" width="120" height="16" fill="#0b0706"/>
  <rect x="712" y="716" width="10" height="84" fill="#0b0706"/><rect x="798" y="716" width="10" height="84" fill="#0b0706"/>
  <path d="M720 700 Q712 600 760 560 Q800 540 812 600 L820 700Z" fill="#1f5a45"/>
  <path d="M790 590 Q830 590 845 605" stroke="#1f5a45" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="770" cy="520" r="38" fill="#5b3a29"/>
  <path d="M736 505 Q770 470 806 505 Q800 480 770 474 Q740 478 736 505Z" fill="#120a08"/>
  <!-- sign -->
  <rect x="140" y="110" width="320" height="90" rx="10" fill="none" stroke="#e9b949" stroke-width="5" opacity="0.8"/>
  <text x="300" y="168" fill="#e9b949" font-family="Georgia, serif" font-size="40" font-style="italic" text-anchor="middle" opacity="0.85">Snug Harbor</text>
  <g font-family="system-ui, sans-serif" fill="#fff" opacity="0.75">
    <rect x="1120" y="930" width="456" height="46" rx="6" fill="#000" opacity="0.5"/>
    <text x="1348" y="960" font-size="18" text-anchor="middle">PLACEHOLDER · Snug Harbor stage scene (Gabe)</text>
  </g>
</svg>
